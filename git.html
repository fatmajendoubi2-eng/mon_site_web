<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Super Site Web</title>
    <style>
        /* تصميم خلفية وألوان الصفحة
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            text-align: center;
            padding: 40px;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

    
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            color: #333;
        }

        h1 {
            color: #4a00e0;
            margin-bottom: 10px;
        }

        p {
            font-size: 16px;
            color: #555;
            line-height: 1.6;
        }

        /* تنسيق الأزرار الجميلة */
        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #4a00e0;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: background 0.3s ease;
        }

        .btn:hover {
            background-color: #764ba2;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Bienvenue sur mon site web !</h1>
        <p><strong>Visual Studio Code</strong> <strong>Git & GitHub</strong>.</p>
        <a href="https://github.com/fatmajendoubi2-eng" target="_blank" class="btn">GitHub</a>
    </div>

</body>
</html>
